name: Validate

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check migration immutability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/deployment/database.py check-local
      - run: python3 -m unittest discover -s tools/deployment -p 'test_*.py' -v
      - run: node --test tools/deployment/release.test.mjs
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @smoke-notes/web build
      - name: Test migrations and concurrency in disposable PostgreSQL
        run: python3 supabase/tests/database/test_mutation.py
