name: Production (gated)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Plan is read-only; deploy also requires the enable variable
        type: choice
        default: plan
        options: [plan, deploy]

permissions:
  contents: read

# Never interrupt a database change. Superseded queued runs fail the main SHA check.
concurrency:
  group: smoke-notes-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    if: >-
      github.repository == 'ppwwq/smoke-notes' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'plan') ||
       vars.SMOKE_PRODUCTION_DEPLOY_ENABLED == 'true')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: https://koundrkjeambrcodxkdd.supabase.co
      VITE_WEB_APP_URL: https://smoke-notes-philipwwq.pages.dev
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: 86eac8fedb92cf5e11c160669b5605b7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.116.0
      - name: Install build and deployment tools before loading credentials
        run: |
          pnpm install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/smoke-deploy" --no-audit --no-fund --ignore-scripts wrangler@4.129.0
          echo "$RUNNER_TEMP/smoke-deploy/node_modules/.bin" >> "$GITHUB_PATH"
          command -v psql
      - name: Check public configuration and build immutable release
        run: |
          node tools/deployment/release.mjs check-config
          pnpm --filter @smoke-notes/web build
          node tools/deployment/release.mjs stamp
      - name: Check current main and existing cloud targets
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/deployment/release.mjs preflight
      - name: Verify migration history and plan pending SQL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 tools/deployment/database.py plan
      - name: Apply only new migrations
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node tools/deployment/release.mjs check-main
          python3 tools/deployment/database.py migrate
      - name: Publish and verify Edge Functions
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node tools/deployment/release.mjs functions
      - name: Publish frontend last and verify live release
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/deployment/release.mjs pages
