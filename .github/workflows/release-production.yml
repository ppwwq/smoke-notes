name: Manual production release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only baseline audit or separately approved production release
        required: true
        default: audit_only
        type: choice
        options:
          - audit_only
          - adopt_baseline
          - release
      baseline_ack:
        description: "Metadata only: ADOPT_PRIOR_SEVEN_KEEP_DATA:<full SHA>:<project ref>"
        required: false
        type: string
      release_sha:
        description: Reviewed full 40-character SHA; must equal current main
        required: true
        type: string
      backup_evidence_id:
        description: Required for verified_backup; leave empty for no_backup (no URL/secrets)
        required: false
        type: string
      release_mode:
        description: Backup policy; no_backup explicitly accepts data-loss risk
        required: true
        default: verified_backup
        type: choice
        options:
          - verified_backup
          - no_backup
      no_backup_risk_ack:
        description: "Only for no_backup: I_ACCEPT_DATA_LOSS_WITHOUT_BACKUP:<full SHA>:<project ref>"
        required: false
        type: string

permissions:
  contents: read
  actions: read

# Serialize all production phases. Never cancel a migration already in progress.
concurrency:
  group: smoke-notes-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  RELEASE_SHA: ${{ inputs.release_sha }}
  BACKUP_EVIDENCE_ID: ${{ inputs.backup_evidence_id }}
  RELEASE_MODE: ${{ inputs.release_mode }}
  NO_BACKUP_RISK_ACK: ${{ inputs.no_backup_risk_ack }}
  BASELINE_ACK: ${{ inputs.baseline_ack }}

jobs:
  validate:
    if: >-
      github.repository == 'ppwwq/smoke-notes' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.release_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check trusted main and required environment protection (no production secrets)
        run: python3 tools/production/guard.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Install reviewed application lockfile without production credentials
        run: |
          corepack enable
          corepack prepare pnpm@10.19.0 --activate
          pnpm install --frozen-lockfile
      - name: Application and release safeguards
        run: |
          python3 -m unittest discover -s tools/production -p 'test_*.py' -v
          pnpm typecheck
          pnpm lint
          pnpm test
          python3 supabase/tests/database/test_mutation.py
          pnpm --filter @smoke-notes/web build

  audit:
    needs: validate
    if: >-
      inputs.operation == 'audit_only' &&
      github.repository == 'ppwwq/smoke-notes' &&
      github.ref == 'refs/heads/main' && inputs.release_sha == github.sha
    environment: production-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck reviewed main and both protected environments
        run: python3 tools/production/guard.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build synthetic reference before receiving database credentials
        run: |
          command -v psql
          python3 tools/production/audit_reference.py "$RUNNER_TEMP/audit-reference.json"
      - name: Recheck reviewed main at the read boundary
        run: python3 tools/production/guard.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Read-only catalog and migration history audit
        run: python3 tools/production/audit_only.py "$RUNNER_TEMP/audit-reference.json"
        env:
          AUDIT_OPERATION: audit_only
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  baseline:
    needs: validate
    if: >-
      inputs.operation == 'adopt_baseline' &&
      github.repository == 'ppwwq/smoke-notes' &&
      github.ref == 'refs/heads/main' && inputs.release_sha == github.sha
    environment: production-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact metadata-only adoption and no-backup acknowledgement
        run: |
          python3 tools/production/guard.py
          python3 -c 'import os,sys; sys.path.insert(0,"tools/production"); import adopt_baseline; adopt_baseline.validate_inputs(os.environ)'
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_OPERATION: ${{ inputs.operation }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - name: Build isolated references without production credentials
        run: python3 tools/production/audit_reference.py "$RUNNER_TEMP/audit-reference.json"
      - name: Recheck reviewed main and environment protection before metadata write
        run: python3 tools/production/guard.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Adopt only the verified existing baseline metadata
        run: python3 tools/production/adopt_baseline.py "$RUNNER_TEMP/audit-reference.json"
        env:
          BASELINE_OPERATION: ${{ inputs.operation }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  backend:
    needs: validate
    if: >-
      inputs.operation == 'release' &&
      github.repository == 'ppwwq/smoke-notes' &&
      github.ref == 'refs/heads/main' && inputs.release_sha == github.sha
    environment: production-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck main and selected release risk policy before deployment secrets
        run: python3 tools/production/guard.py --release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          BACKUP_RESTORE_ATTESTATION: ${{ vars.BACKUP_RESTORE_ATTESTATION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Install pinned CLI without production credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/release-tools" --no-save supabase@2.121.0
          echo "$RUNNER_TEMP/release-tools/node_modules/.bin" >> "$GITHUB_PATH"
          command -v psql
      - name: Recheck main and selected release risk policy at the backend write boundary
        run: python3 tools/production/guard.py --release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          BACKUP_RESTORE_ATTESTATION: ${{ vars.BACKUP_RESTORE_ATTESTATION }}
      - name: Apply only reviewed migration, check preservation and deploy existing Edge Function
        run: python3 tools/production/backend.py
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Verify two isolated hosted API clients before allowing web deployment
        run: python3 tools/production/hosted_sync.py
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

  web:
    needs: backend
    if: >-
      inputs.operation == 'release' &&
      github.repository == 'ppwwq/smoke-notes' &&
      github.ref == 'refs/heads/main' && inputs.release_sha == github.sha
    environment: production-web
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck reviewed main after the second environment approval
        run: python3 tools/production/guard.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Install reviewed dependencies without production deployment credentials
        run: |
          corepack enable
          corepack prepare pnpm@10.19.0 --activate
          pnpm install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/release-tools" --no-save wrangler@4.151.2
          echo "$RUNNER_TEMP/release-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build with public browser configuration only
        run: |
          python3 tools/production/hosted_sync.py --config-only
          pnpm --filter @smoke-notes/web build
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_WEB_APP_URL: https://smoke-notes-philipwwq.pages.dev
      - name: Check backend again immediately before publishing
        run: python3 tools/production/hosted_sync.py
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Recheck main at the final write boundary
        run: python3 tools/production/guard.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload only dist and verify production deployment SHA and bytes
        run: python3 tools/production/pages.py
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
