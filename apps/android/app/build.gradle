plugins { id 'com.android.application' }
def config = new Properties()
def envFile = rootProject.file('../../.env')
if (envFile.exists()) envFile.withReader('UTF-8') { reader -> config.load(reader) }
def literal = { String value -> '"' + (value ?: '').replace('"','').trim() + '"' }
android {
    namespace 'app.jotday.calendar'
    compileSdk 35
    defaultConfig {
        applicationId 'app.jotday.calendar'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'CLOUD_URL', literal(config.getProperty('VITE_SUPABASE_URL'))
        buildConfigField 'String', 'PUBLIC_KEY', literal(config.getProperty('VITE_SUPABASE_PUBLISHABLE_KEY'))
        testInstrumentationRunner 'app.jotday.calendar.NativeChecks'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
    sourceSets { test.resources.srcDir '../../../packages/core/test-fixtures' }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
